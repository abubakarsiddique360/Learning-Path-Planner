name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test
        run: python -m pytest
      - name: Plan the example catalogue
        run: |
          python -m learning_path_planner check examples/backend-path.json
          python -m learning_path_planner stats examples/backend-path.json
          python -m learning_path_planner plan examples/backend-path.json --markdown > plan.md
          python -m learning_path_planner graph examples/backend-path.json > graph.mmd
          python -m learning_path_planner check examples/cyclic-path.json || echo "cycle detected as expected"
